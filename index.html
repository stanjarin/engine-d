const paradoxes=[["LIAR","True / False","A sentence declares itself false. If it is true, it must be false; if false, it must be true."],["RUSSELL","Self-containing sets","Consider the set of all sets that do not contain themselves. Does that set contain itself? Either answer leads to contradiction."],["BARBER","Who shaves whom?","A barber shaves exactly those people who do not shave themselves. Can the barber shave himself? Neither answer works."],["HANGING","Unexpected certainty","A prisoner is promised an execution next week on a day that will surprise him. His reasoning seems to rule out every day, yet an execution could still surprise him."],["CROCODILE","Prediction traps promise","A crocodile says it will return a child if a parent correctly predicts its action. The parent predicts the child will not be returned, making the promise paradoxical."],["SORITES","When does it change?","Take a grain from a heap and it remains a heap. Repeat the reasoning: when, precisely, does the heap cease being a heap?"],["PINOCCHIO","Truth grows lies","Pinocchio says his nose is about to grow. If his nose grows only when he lies, the prediction creates a contradiction."],["THESEUS","Same / Different","Every plank of a ship is replaced. Is it the same ship? If the original planks form another ship, which one is the original?"],["GRANDFATHER","Erasing your existence","A time traveller prevents an ancestor from having children, apparently preventing the traveller from existing to make the journey."],["BOOTSTRAP","Origin without creator","An object or piece of information goes back in time and becomes the source of itself. Where did it originally come from?"],["TELEPORTATION","Copy or self?","A machine destroys someone and recreates an exact duplicate elsewhere. Does the original person survive or is the duplicate a new person?"],["VAT","Is reality real?","A brain supplied with perfectly simulated sensations might not be able to distinguish that experience from ordinary reality."],["RAVENS","Apples prove ravens","The claim that all ravens are black is logically equivalent to saying all nonblack things are not ravens. Does a green apple confirm the claim?"],["FICTION","Imaginary real emotions","Why do fictional events and people evoke genuine emotions when we know they are not real?"],["ACHILLES","Never catches tortoise","Achilles must first reach where a tortoise was; by then it has moved ahead. The infinitely repeated reasoning seems to prevent him catching it."],["DICHOTOMY","Infinite halfway points","To reach a destination, first cross half the distance, then half the remainder, and so on. How can infinitely many stages be completed?"],["ARROW","Motion without movement","At any instant, a flying arrow occupies one particular position. How can motion consist of such instants?"],["HILBERT","Full yet available","An infinite hotel with every room occupied can still fit another guest, or infinitely many additional guests, by moving existing guests."],["BANACH–TARSKI","One becomes two","In idealised mathematics, a sphere can be divided into finitely many highly nonordinary pieces and reassembled into two spheres, each the original size."],["TWINS","Different ageing rates","A twin who travels near the speed of light returns younger than the twin who stayed on Earth. Relativity resolves the apparent puzzle."],["PREDESTINATION","Cause follows effect","A person travels back to prevent an event but their actions turn out to be the very cause of the event."],["MONTY HALL","Switching beats staying","After choosing one of three doors, a host knowingly reveals a losing door. Under standard rules, switching doubles the chance of winning."],["BIRTHDAY","Unexpected shared birthdays","Among only 23 randomly selected people, the probability that two share a birthday exceeds 50 percent."],["ENVELOPES","Always switch?","One of two envelopes holds twice as much money as the other. An invalid expectation argument seems to recommend switching no matter which one you hold."],["SIMPSON","Reversed statistical trends","A relationship present in separate statistical groups can reverse when the groups are combined, because of how the groups are distributed."],["PETERSBURG","Infinite expected winnings","A game has infinite mathematical expected winnings but most people would pay only a modest price to play it."],["FRIENDSHIP","Friends have more","On average, your friends have more friends than you do, because popular people appear in more friendship lists."],["BRAESS","More roads slower","Adding a road can worsen travel times when drivers independently choose routes that seem best for themselves."],["CHOICE","More means less","More options can make decisions harder and, in some circumstances, reduce satisfaction with the choice made."],["ABILENE","Unwanted collective agreement","A group chooses an action nobody privately wants because each member incorrectly assumes the others favour it."],["TOLERANCE","Tolerance destroys itself","Unlimited tolerance may allow intolerant groups to abolish the very tolerance that permits them to operate."],["HEDONISM","Pursuit defeats happiness","Striving directly for happiness can sometimes make happiness harder to obtain."],["THRIFT","Saving impoverishes everyone","Saving more may be wise individually, yet if everybody cuts spending at once the economy may weaken, reducing total savings."],["OMNIPOTENCE","Unlimited power limited","Could an all-powerful being create a stone so heavy that even it could not lift it? Both possible answers appear to limit its power."],["CATCH-22","Escape proves sanity","A pilot can be relieved from dangerous duties for insanity, but requesting relief is treated as proof of sanity."],["OBSERVER","Observation changes behaviour","People may behave differently when they know they are being watched, obstructing attempts to observe natural behaviour."],["SCHROEDINGER","Dead / Alive","A hypothetical cat is coupled to a quantum event, exposing the puzzling implications of quantum superposition when applied to macroscopic objects."],["FERMI","Where is everybody?","Given the vast number of stars and potentially habitable worlds, why is there no convincing evidence yet of extraterrestrial civilisations?"],["OLBERS","Why darkness persists","If an eternal, infinite, static universe were uniformly filled with stars, why would the night sky be dark?"],["MAXWELL","Entropy defied","An imaginary demon sorts fast and slow molecules, seemingly decreasing entropy without expenditure, challenging thermodynamics."],["MPEMBA","Hot freezes faster","Under some conditions, initially warmer water can freeze earlier than initially cooler water."],["GIBBS","Mixing identical gases","Classical entropy seems to behave oddly when gases being mixed become indistinguishable, highlighting particle identity."]];

r behaviour into an outrageous form."], ["Imitation", "Copy another", "Copy someone or something for humorous effect."], ["Impersonation", "Borrowed identity", "Assume another person’s identity or persona."], ["Mimicry", "Copied mannerisms", "Imitate another person’s distinctive voice, gestures or habits."], ["Parody", "Style imitated", "Exaggerate the characteristic style of a recognisable work, genre or creator."], ["Scale", "Wrong proportions", "Use disproportionate size, magnitude or status as a source of humour."], ["Stereotype", "Familiar type", "Exaggerate traits of a familiar stock character or social category."], ["Chase", "Pursuit and evasion", "Physical pursuit and escape, often with mounting complications."], ["Slapstick", "Physical mishaps", "Humour through exaggerated physical collisions, falls or mishaps."], ["Speed", "Accelerated tempo", "Comic effect created through changes in pace, timing or acceleration."]];
